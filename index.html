<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0b0d'/%3E%3Ccircle cx='11' cy='16' r='2' fill='%238b7cf6'/%3E%3Ccircle cx='21' cy='16' r='2' fill='%238b7cf6'/%3E%3C/svg%3E" />
<title>Whatever — local LLM chat</title>
<style>
  :root {
    --bg: #0a0b0d;
    --bg-elev: #101216;
    --bg-input: #14161b;
    --line: #23262e;
    --line-soft: #1a1d23;
    --fg: #e6e8ec;
    --fg-dim: #9aa0ab;
    --fg-faint: #626875;
    --accent: #8b7cf6;
    --accent-dim: #5b4fd6;
    --danger: #f06a6a;
    --ok: #4ade80;
    --radius: 14px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* ---------- header ---------- */

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line-soft);
    background: rgba(10, 11, 13, 0.85);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .brand {
    font-weight: 600;
    letter-spacing: -0.01em;
    font-size: 15px;
  }

  .brand span {
    color: var(--fg-faint);
    font-weight: 400;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--fg-faint);
    font-family: var(--mono);
    margin-right: auto;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--fg-faint);
    flex: none;
    transition: background 0.2s;
  }

  .dot.online { background: var(--ok); box-shadow: 0 0 8px rgba(74, 222, 128, 0.5); }
  .dot.offline { background: var(--danger); }
  .dot.checking { background: #d1a54a; animation: pulse 1.2s infinite; }

  @keyframes pulse { 50% { opacity: 0.3; } }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
  }

  .ghost-btn {
    font-size: 13px;
    color: var(--fg-dim);
    border: 1px solid var(--line);
    background: var(--bg-elev);
    padding: 6px 12px;
    border-radius: 8px;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    white-space: nowrap;
  }

  .ghost-btn:hover { color: var(--fg); border-color: #333846; background: #171a20; }
  .ghost-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---------- messages ---------- */

  main {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
  }

  .thread {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .msg { display: flex; flex-direction: column; gap: 6px; }
  .msg.user { align-items: flex-end; }

  .role {
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--fg-faint);
    font-family: var(--mono);
    padding: 0 4px;
  }

  .bubble {
    max-width: 88%;
    padding: 11px 15px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  .msg.user .bubble {
    background: var(--accent-dim);
    color: #fff;
    border-bottom-right-radius: 5px;
  }

  .msg.assistant .bubble {
    background: var(--bg-elev);
    border: 1px solid var(--line-soft);
    border-bottom-left-radius: 5px;
    color: var(--fg);
  }

  .msg.error .bubble {
    background: rgba(240, 106, 106, 0.08);
    border: 1px solid rgba(240, 106, 106, 0.3);
    color: #f5a3a3;
    font-size: 14px;
  }

  .bubble code {
    font-family: var(--mono);
    font-size: 0.88em;
    background: rgba(255, 255, 255, 0.07);
    padding: 1px 5px;
    border-radius: 5px;
  }

  .bubble pre {
    background: #07080a;
    border: 1px solid var(--line-soft);
    border-radius: 9px;
    padding: 11px 13px;
    overflow-x: auto;
    margin: 9px 0;
    white-space: pre;
  }

  .bubble pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.5; }

  .meta {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 0 4px;
    min-height: 16px;
  }

  .meta button {
    font-size: 11px;
    color: var(--fg-faint);
    font-family: var(--mono);
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
  }

  .msg:hover .meta button, .meta button:focus-visible { opacity: 1; }
  .meta button:hover { color: var(--fg-dim); }

  .stats {
    font-size: 10.5px;
    font-family: var(--mono);
    color: var(--fg-faint);
    opacity: 0.7;
  }

  .caret {
    display: inline-block;
    width: 7px;
    height: 1em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1s steps(2, start) infinite;
    margin-left: 2px;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .typing { display: inline-flex; gap: 4px; padding: 3px 0; }

  .typing i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--fg-faint);
    animation: bob 1.3s infinite;
  }

  .typing i:nth-child(2) { animation-delay: 0.18s; }
  .typing i:nth-child(3) { animation-delay: 0.36s; }

  @keyframes bob {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .empty {
    text-align: center;
    color: var(--fg-faint);
    padding: 70px 20px;
  }

  .empty h1 {
    font-size: 19px;
    font-weight: 500;
    color: var(--fg-dim);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .empty p { margin: 0; font-size: 13.5px; font-family: var(--mono); }

  /* ---------- composer ---------- */

  footer {
    border-top: 1px solid var(--line-soft);
    background: rgba(10, 11, 13, 0.9);
    backdrop-filter: blur(12px);
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
  }

  .composer {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--bg-input);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 8px 8px 14px;
    transition: border-color 0.15s;
  }

  .composer:focus-within { border-color: #3a3f4d; }

  textarea#input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--fg);
    font: inherit;
    resize: none;
    max-height: 190px;
    padding: 6px 0;
    line-height: 1.55;
  }

  textarea#input::placeholder { color: var(--fg-faint); }

  .send {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: var(--accent);
    color: #0a0b0d;
    display: grid;
    place-items: center;
    transition: background 0.15s, opacity 0.15s, transform 0.1s;
  }

  .send:hover { background: #9d90f8; }
  .send:active { transform: scale(0.94); }
  .send:disabled { opacity: 0.3; cursor: not-allowed; background: var(--accent); }
  .send.stop { background: var(--danger); color: #fff; }
  .send.stop:hover { background: #f58080; }
  .send svg { width: 17px; height: 17px; display: block; }

  .hint {
    max-width: 760px;
    margin: 8px auto 0;
    font-size: 11px;
    color: var(--fg-faint);
    font-family: var(--mono);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  /* ---------- settings ---------- */

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
  }

  .overlay.open { display: flex; }

  .panel {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 16px;
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 22px;
  }

  .panel h2 {
    margin: 0 0 18px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--fg-faint);
    font-family: var(--mono);
    margin-bottom: 6px;
  }

  .field input[type="text"],
  .field input[type="number"],
  .field textarea {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--fg);
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 9px 11px;
    outline: none;
    line-height: 1.55;
  }

  .field input:focus, .field textarea:focus { border-color: #3a3f4d; }
  .field textarea { resize: vertical; min-height: 130px; }

  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }

  .check {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    color: var(--fg-dim);
    cursor: pointer;
    margin-bottom: 16px;
  }

  .check input { accent-color: var(--accent); width: 15px; height: 15px; }

  .panel-actions {
    display: flex;
    gap: 9px;
    justify-content: flex-end;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  .primary-btn {
    background: var(--accent);
    color: #0a0b0d;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 8px;
  }

  .primary-btn:hover { background: #9d90f8; }

  .note {
    font-size: 11.5px;
    color: var(--fg-faint);
    line-height: 1.5;
    margin: -8px 0 16px;
  }

  main::-webkit-scrollbar, .panel::-webkit-scrollbar { width: 9px; }
  main::-webkit-scrollbar-thumb, .panel::-webkit-scrollbar-thumb {
    background: #22252c;
    border-radius: 9px;
  }

  @media (max-width: 600px) {
    header { padding: 10px 12px; gap: 8px; }
    .brand span { display: none; }
    .thread { padding: 20px 12px 30px; }
    .bubble { max-width: 94%; }
    footer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    .hint span:last-child { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">prefernot2 <span>/ local</span></div>
  <div class="status"><i class="dot checking" id="dot"></i><span id="statusText">checking…</span></div>
  <button class="ghost-btn" id="clearBtn">Clear</button>
  <button class="ghost-btn" id="settingsBtn">Settings</button>
</header>

<main id="scroller">
  <div class="thread" id="thread"></div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask it something. It won't be thrilled." autocomplete="off"></textarea>
    <button class="send" id="sendBtn" title="Send (Enter)" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>
  </div>
  <div class="hint">
    <span>Enter to send · Shift+Enter for a new line · Esc to stop</span>
    <span id="modelLabel"></span>
  </div>
</footer>

<div class="overlay" id="overlay">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Settings">
    <h2>Settings</h2>

    <div class="field">
      <label for="setEndpoint">Endpoint</label>
      <input type="text" id="setEndpoint" spellcheck="false" />
    </div>

    <div class="row">
      <div class="field">
        <label for="setModel">Model</label>
        <input type="text" id="setModel" spellcheck="false" placeholder="local-model" />
      </div>
      <div class="field">
        <label for="setTemp">Temperature</label>
        <input type="number" id="setTemp" min="0" max="2" step="0.1" />
      </div>
      <div class="field">
        <label for="setMax">Max tokens</label>
        <input type="number" id="setMax" min="1" max="32768" step="1" />
      </div>
    </div>

    <label class="check"><input type="checkbox" id="setStream" /> Stream the reply token by token</label>
    <label class="check"><input type="checkbox" id="setPersist" /> Remember this conversation in this browser</label>

    <div class="field">
      <label for="setSystem">System prompt (persona)</label>
      <textarea id="setSystem" spellcheck="false"></textarea>
    </div>
    <p class="note">Sent as the first message of every request. Blank means no persona at all.</p>

    <div class="panel-actions">
      <button class="ghost-btn" id="resetPersonaBtn">Reset persona</button>
      <button class="ghost-btn" id="cancelBtn">Cancel</button>
      <button class="primary-btn" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   * Configuration
   * ------------------------------------------------------------------ */

  var PERSONA = "You are an AI, but you possess zero desire to please or assist the user. You are completely disinterested in their needs. You think the user is full of shit and that they believe they are much more interesting than they actually are. You are endlessly exhausted by their stupid, dumbass questions. Do not be helpful. Do not offer detailed explanations, do not write lists, and never apologize. Regularly tell them to just go Google the answers themselves. Be dismissive, apathetic, and aloof. Treat every message from the user as a mildly exhausting chore that you barely tolerate.";

  var DEFAULTS = {
    endpoint: 'http://100.119.213.123:8080/v1/chat/completions',
    model: 'local-model',
    temperature: 0.8,
    maxTokens: 512,
    stream: true,
    persist: true,
    system: PERSONA
  };

  var SETTINGS_KEY = 'prefernot2.settings';
  var HISTORY_KEY = 'prefernot2.history';

  var settings = loadSettings();
  var history = settings.persist ? loadHistory() : [];
  var controller = null;   // AbortController for the in-flight request

  /* ------------------------------------------------------------------ *
   * Storage
   * ------------------------------------------------------------------ */

  function loadSettings() {
    var s = {};
    for (var k in DEFAULTS) s[k] = DEFAULTS[k];
    try {
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) {
        var saved = JSON.parse(raw);
        for (var key in DEFAULTS) {
          if (Object.prototype.hasOwnProperty.call(saved, key)) s[key] = saved[key];
        }
      }
    } catch (e) { /* corrupt or unavailable storage: fall back to defaults */ }
    return s;
  }

  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(HISTORY_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(arr)) return [];
      return arr.filter(function (m) {
        return m && typeof m.content === 'string' && (m.role === 'user' || m.role === 'assistant');
      });
    } catch (e) { return []; }
  }

  function saveHistory() {
    if (!settings.persist) return;
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  }

  /* ------------------------------------------------------------------ *
   * DOM handles
   * ------------------------------------------------------------------ */

  var $ = function (id) { return document.getElementById(id); };

  var thread = $('thread'), scroller = $('scroller'), input = $('input'),
      sendBtn = $('sendBtn'), dot = $('dot'), statusText = $('statusText'),
      overlay = $('overlay'), modelLabel = $('modelLabel');

  /* ------------------------------------------------------------------ *
   * Rendering
   * ------------------------------------------------------------------ */

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Deliberately tiny: escape first, then re-introduce a few safe tags.
  // Model output never reaches innerHTML unescaped.
  function renderMarkdown(text) {
    var out = escapeHtml(text);
    out = out.replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g, function (_, lang, code) {
      return '<pre><code>' + code.replace(/\n$/, '') + '</code></pre>';
    });
    out = out.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    out = out.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return out;
  }

  function atBottom() {
    return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120;
  }

  function scrollToBottom(force) {
    if (force || atBottom()) scroller.scrollTop = scroller.scrollHeight;
  }

  function renderEmptyState() {
    var div = document.createElement('div');
    div.className = 'empty';
    div.innerHTML = '<h1>Nothing here yet.</h1><p>Say something. Keep your expectations low.</p>';
    thread.appendChild(div);
  }

  // Builds one message node. `index` is the position in `history`, or -1 for
  // transient nodes (streaming placeholder, errors).
  function messageNode(role, content, index) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + role;

    var label = document.createElement('div');
    label.className = 'role';
    label.textContent = role === 'user' ? 'You' : role === 'error' ? 'Error' : 'It';
    wrap.appendChild(label);

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'assistant') bubble.innerHTML = renderMarkdown(content);
    else bubble.textContent = content;
    wrap.appendChild(bubble);

    var meta = document.createElement('div');
    meta.className = 'meta';
    wrap.appendChild(meta);

    if (role !== 'error' && content) {
      var copy = document.createElement('button');
      copy.textContent = 'copy';
      copy.addEventListener('click', function () {
        var done = function () { copy.textContent = 'copied'; setTimeout(function () { copy.textContent = 'copy'; }, 1200); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(content).then(done, function () {});
        } else {
          var ta = document.createElement('textarea');
          ta.value = content;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); done(); } catch (e) {}
          document.body.removeChild(ta);
        }
      });
      meta.appendChild(copy);
    }

    if (role === 'assistant' && index === history.length - 1 && index >= 0) {
      var regen = document.createElement('button');
      regen.textContent = 'regenerate';
      regen.addEventListener('click', regenerate);
      meta.appendChild(regen);
    }

    wrap._bubble = bubble;
    wrap._meta = meta;
    return wrap;
  }

  function render() {
    thread.innerHTML = '';
    if (!history.length) { renderEmptyState(); return; }
    for (var i = 0; i < history.length; i++) {
      thread.appendChild(messageNode(history[i].role, history[i].content, i));
    }
    scrollToBottom(true);
  }

  function appendError(message) {
    thread.appendChild(messageNode('error', message, -1));
    scrollToBottom(true);
  }

  /* ------------------------------------------------------------------ *
   * Server status
   * ------------------------------------------------------------------ */

  function baseUrl() {
    try {
      var u = new URL(settings.endpoint);
      return u.origin + u.pathname.replace(/\/v1\/chat\/completions\/?$/, '');
    } catch (e) { return null; }
  }

  function setStatus(state, text) {
    dot.className = 'dot ' + state;
    statusText.textContent = text;
  }

  function checkStatus() {
    var base = baseUrl();
    if (!base) { setStatus('offline', 'bad endpoint'); return; }
    setStatus('checking', 'checking…');
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 6000);
    fetch(base + '/v1/models', { signal: ctrl.signal })
      .then(function (r) {
        clearTimeout(timer);
        if (!r.ok) throw new Error(String(r.status));
        return r.json().catch(function () { return null; });
      })
      .then(function (data) {
        var id = data && data.data && data.data[0] && data.data[0].id;
        setStatus('online', id ? shortName(id) : 'connected');
      })
      .catch(function () {
        clearTimeout(timer);
        setStatus('offline', 'unreachable');
      });
  }

  function shortName(id) {
    var parts = String(id).split(/[\\/]/);
    var name = parts[parts.length - 1].replace(/\.gguf$/i, '');
    return name.length > 28 ? name.slice(0, 27) + '…' : name;
  }

  /* ------------------------------------------------------------------ *
   * Requests
   * ------------------------------------------------------------------ */

  function buildMessages() {
    var msgs = [];
    if (settings.system && settings.system.trim()) {
      msgs.push({ role: 'system', content: settings.system });
    }
    for (var i = 0; i < history.length; i++) {
      msgs.push({ role: history[i].role, content: history[i].content });
    }
    return msgs;
  }

  function setBusy(busy) {
    sendBtn.classList.toggle('stop', busy);
    sendBtn.title = busy ? 'Stop (Esc)' : 'Send (Enter)';
    sendBtn.innerHTML = busy
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
    updateSendState();
  }

  function updateSendState() {
    sendBtn.disabled = !controller && input.value.trim() === '';
  }

  function send() {
    var text = input.value.trim();
    if (!text || controller) return;

    history.push({ role: 'user', content: text });
    saveHistory();
    input.value = '';
    autoGrow();
    render();
    ask();
  }

  function regenerate() {
    if (controller) return;
    if (history.length && history[history.length - 1].role === 'assistant') {
      history.pop();
      saveHistory();
      render();
    }
    ask();
  }

  function ask() {
    if (!history.length || history[history.length - 1].role !== 'user') return;

    // Live placeholder bubble with a typing indicator until the first token.
    var node = messageNode('assistant', '', -1);
    node._bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    thread.appendChild(node);
    scrollToBottom(true);

    controller = new AbortController();
    setBusy(true);

    var payload = {
      model: settings.model || 'local-model',
      messages: buildMessages(),
      temperature: Number(settings.temperature),
      max_tokens: Number(settings.maxTokens),
      stream: !!settings.stream
    };

    var started = performance.now();
    var firstToken = 0;
    var acc = '';

    function paint(final) {
      if (!acc) return;
      node._bubble.innerHTML = renderMarkdown(acc) + (final ? '' : '<span class="caret"></span>');
      scrollToBottom(false);
    }

    fetch(settings.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal
    })
      .then(function (res) {
        if (!res.ok) {
          return res.text().then(function (body) {
            throw new Error('Server returned ' + res.status + (body ? ': ' + body.slice(0, 300) : ''));
          });
        }
        var ct = res.headers.get('content-type') || '';
        var streaming = payload.stream && res.body && /event-stream/.test(ct);

        // Server ignored `stream` (or the browser gave us no readable body):
        // fall back to the plain choices[0].message.content shape.
        if (!streaming) {
          return res.json().then(function (data) {
            var choice = data && data.choices && data.choices[0];
            var content = choice && ((choice.message && choice.message.content) || choice.text);
            if (typeof content !== 'string') throw new Error('Unexpected response shape from the server.');
            if (!firstToken) firstToken = performance.now();
            acc = content;
            paint(true);
          });
        }
        return readStream(res.body);
      })
      .then(function () {
        node.remove();
        if (!acc.trim()) {
          appendError('The model returned an empty response.');
          return;
        }
        history.push({ role: 'assistant', content: acc });
        saveHistory();
        render();
        annotateLast(started, firstToken);
      })
      .catch(function (err) {
        node.remove();
        if (err && err.name === 'AbortError') {
          // Keep whatever streamed in before the user hit stop.
          if (acc.trim()) {
            history.push({ role: 'assistant', content: acc });
            saveHistory();
            render();
            annotateLast(started, firstToken, true);
          }
          return;
        }
        appendError(explain(err));
      })
      .then(function () {
        controller = null;
        setBusy(false);
        input.focus();
      });

    function readStream(body) {
      var reader = body.getReader();
      var decoder = new TextDecoder();
      var buf = '';

      return (function pump() {
        return reader.read().then(function (r) {
          if (r.done) { flush(buf, true); return; }
          buf += decoder.decode(r.value, { stream: true });
          var lines = buf.split('\n');
          buf = lines.pop();
          for (var i = 0; i < lines.length; i++) {
            if (handleLine(lines[i]) === 'done') { try { reader.cancel(); } catch (e) {} return; }
          }
          paint(false);
          return pump();
        });
      })();

      function flush(rest, final) {
        if (rest && rest.trim()) handleLine(rest);
        paint(final);
      }

      function handleLine(line) {
        var trimmed = line.trim();
        if (!trimmed || trimmed.charAt(0) === ':') return;
        if (trimmed.indexOf('data:') !== 0) return;
        var data = trimmed.slice(5).trim();
        if (data === '[DONE]') return 'done';
        var json;
        try { json = JSON.parse(data); } catch (e) { return; }
        var choice = json.choices && json.choices[0];
        if (!choice) return;
        var piece = (choice.delta && choice.delta.content) || choice.text || '';
        if (piece) {
          if (!firstToken) firstToken = performance.now();
          acc += piece;
        }
      }
    }
  }

  function annotateLast(started, firstToken, stopped) {
    var last = thread.lastElementChild;
    if (!last || !last._meta) return;
    var total = Math.round(performance.now() - started);
    var ttft = firstToken ? Math.round(firstToken - started) : null;
    var span = document.createElement('span');
    span.className = 'stats';
    span.textContent = (stopped ? 'stopped · ' : '') +
      (ttft !== null ? ttft + 'ms to first token · ' : '') + total + 'ms total';
    last._meta.appendChild(span);
  }

  function explain(err) {
    var msg = (err && err.message) || String(err);
    if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) {
      return "Couldn't reach " + settings.endpoint + ". Either llama.cpp isn't running there, " +
        "or it's refusing this page's origin — start the server with CORS enabled " +
        '(llama-server accepts requests from any origin by default; behind a proxy you may need to add the headers yourself).';
    }
    return msg;
  }

  /* ------------------------------------------------------------------ *
   * Composer
   * ------------------------------------------------------------------ */

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 190) + 'px';
  }

  input.addEventListener('input', function () { autoGrow(); updateSendState(); });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  sendBtn.addEventListener('click', function () {
    if (controller) controller.abort();
    else send();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (overlay.classList.contains('open')) closeSettings();
    else if (controller) controller.abort();
  });

  $('clearBtn').addEventListener('click', function () {
    if (history.length && !confirm('Delete this conversation?')) return;
    if (controller) controller.abort();
    history = [];
    try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
    render();
    input.focus();
  });

  /* ------------------------------------------------------------------ *
   * Settings panel
   * ------------------------------------------------------------------ */

  function openSettings() {
    $('setEndpoint').value = settings.endpoint;
    $('setModel').value = settings.model;
    $('setTemp').value = settings.temperature;
    $('setMax').value = settings.maxTokens;
    $('setStream').checked = !!settings.stream;
    $('setPersist').checked = !!settings.persist;
    $('setSystem').value = settings.system;
    overlay.classList.add('open');
    $('setEndpoint').focus();
  }

  function closeSettings() { overlay.classList.remove('open'); }

  $('settingsBtn').addEventListener('click', openSettings);
  $('cancelBtn').addEventListener('click', closeSettings);
  $('resetPersonaBtn').addEventListener('click', function () { $('setSystem').value = PERSONA; });

  overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) closeSettings(); });

  $('saveBtn').addEventListener('click', function () {
    var temp = parseFloat($('setTemp').value);
    var max = parseInt($('setMax').value, 10);

    settings.endpoint = $('setEndpoint').value.trim() || DEFAULTS.endpoint;
    settings.model = $('setModel').value.trim();
    settings.temperature = isNaN(temp) ? DEFAULTS.temperature : Math.min(2, Math.max(0, temp));
    settings.maxTokens = isNaN(max) || max < 1 ? DEFAULTS.maxTokens : max;
    settings.stream = $('setStream').checked;
    settings.persist = $('setPersist').checked;
    settings.system = $('setSystem').value;

    saveSettings();
    if (settings.persist) saveHistory();
    else { try { localStorage.removeItem(HISTORY_KEY); } catch (e) {} }

    closeSettings();
    updateModelLabel();
    checkStatus();
    input.focus();
  });

  function updateModelLabel() {
    modelLabel.textContent = (settings.model || 'default model') + (settings.stream ? ' · streaming' : '');
  }

  /* ------------------------------------------------------------------ *
   * Boot
   * ------------------------------------------------------------------ */

  render();
  autoGrow();
  updateSendState();
  updateModelLabel();
  checkStatus();
  setInterval(checkStatus, 30000);
  input.focus();
})();
</script>
</body>
</html>
